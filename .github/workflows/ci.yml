name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Typecheck, Lint, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  db:
    name: Datenbank (Migrationen, Lint, RLS-Tests, Typen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Nur Postgres starten (Migrationen + Seed), das reicht für Tests und Typen
      - run: npx supabase db start
      - run: npm run db:lint
      - run: npm run db:test
      - name: Generierte Typen sind aktuell
        run: |
          npx supabase gen types typescript --local > "$RUNNER_TEMP/types.ts"
          npx prettier --stdin-filepath src/lib/database.types.ts < "$RUNNER_TEMP/types.ts" > "$RUNNER_TEMP/types.fmt.ts"
          diff -u src/lib/database.types.ts "$RUNNER_TEMP/types.fmt.ts" || (echo "::error::src/lib/database.types.ts ist veraltet. Bitte 'npm run db:types' ausführen." && exit 1)
